<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Моя страница</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;

      max-width: 100%;
      max-height: 100vh;
      display: block;
    }

</head>

  <img src="photo.jpg" alt="Описание фото">

</html>
